- job:
    name: stoatchat-rust
    parent: rust-docker
    description: Build the workspace and run the tests against the reference and MongoDB databases.
    nodeset:
      nodes:
        - name: container
          label: pod-rust
        - name: docker
          label: docker-namespace
    semaphores:
      - stoatchat-rust
    run: .zuul/playbooks/rust.yaml
    timeout: 3600

- project:
    check:
      jobs:
        - stoatchat-rust
    gate:
      jobs:
        - stoatchat-rust
