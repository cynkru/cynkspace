name: Docker Test & Publish

on:
  push:
    branches:
      - master
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "scripts/build-image-layer.sh"
      - "Dockerfile"
      - "**/Dockerfile"
      - ".dockerignore"
      - ".github/workflows/docker.yaml"
    tags:
      - "*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: write          # нужно для удаления кэша

concurrency:
  group: docker-test-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v3
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            docker:
              - 'Dockerfile'
              - '**/Dockerfile'
              - '.dockerignore'
              - 'scripts/build-image-layer.sh'
              - 'scripts/publish-debug-image.sh'

  # === Очистка кэша при ручном запуске ===
  clear-cache:
    name: Clear GitHub Actions cache (manual run)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Delete all caches for this repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          echo "Fetching cache list..."
          # Получаем все ключи кэша (пагинация)
          keys=$(gh api -X GET "repos/${REPO}/actions/caches?per_page=100" \
            --paginate --jq '.actions_caches[].key')
          if [ -z "$keys" ]; then
            echo "No caches found."
            exit 0
          fi
          echo "Deleting caches:"
          echo "$keys"
          # Удаляем по ключу (gh api поддерживает key в query)
          while IFS= read -r key; do
            [ -z "$key" ] && continue
            encoded=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$key")
            echo "Deleting cache key: $key"
            gh api -X DELETE "repos/${REPO}/actions/caches?key=${encoded}" || true
          done <<< "$keys"
          echo "Cache cleanup done."

  base:
    name: Test base image build (fork)
    runs-on: ubuntu-latest
    needs: [changes, clear-cache]
    # clear-cache может быть skipped — это нормально
    if: |
      always() &&
      needs.changes.result == 'success' &&
      (needs.clear-cache.result == 'success' || needs.clear-cache.result == 'skipped') &&
      (github.event_name == 'pull_request' || github.event.pull_request.head.repo.fork)
    steps:
      - name: Checkout
        if: needs.changes.outputs.docker == 'true'
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        if: needs.changes.outputs.docker == 'true'
        uses: docker/setup-buildx-action@v2

      - name: Build base image
        if: needs.changes.outputs.docker == 'true'
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository_owner }}/base:latest
          # При ручном запуске — без чтения кэша
          cache-from: ${{ github.event_name != 'workflow_dispatch' && 'type=gha,scope=buildx-base-multi-arch' || '' }}
          cache-to: type=gha,scope=buildx-base-multi-arch,mode=max

  publish:
    runs-on: ubuntu-latest
    needs: clear-cache
    if: |
      always() &&
      (needs.clear-cache.result == 'success' || needs.clear-cache.result == 'skipped') &&
      github.event_name != 'pull_request' &&
      !(github.ref == 'refs/heads/master' && startsWith(github.event.head_commit.message, 'chore(release):'))
    name: Publish Docker images
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Github Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine whether this is the latest release
        id: release
        run: |
          newest=$(git -c versionsort.suffix=-rc ls-remote --tags --refs --sort=-v:refname origin 'v*' \
            | awk '{print $2}' | grep -v -- '-rc\.' | head -n1)
          echo "latest=$([[ "$GITHUB_REF" == "$newest" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Determine base image tag
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "tag=pr-${{ github.event.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      # При ручном запуске не читаем кэш, но пишем заново
      - name: Build base image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/cynkru/base:${{ steps.base.outputs.tag }}
          cache-from: ${{ github.event_name != 'workflow_dispatch' && 'type=gha,scope=buildx-base-multi-arch' || '' }}
          cache-to: type=gha,scope=buildx-base-multi-arch,mode=max

      # cynkru/server
      - name: Docker meta
        id: meta-delta
        uses: docker/metadata-action@v4
        with:
          images: |
            ghcr.io/cynkru/server
          flavor: latest=${{ steps.release.outputs.latest }}
      - name: Publish
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          file: crates/delta/Dockerfile
          tags: ${{ steps.meta-delta.outputs.tags }}
          build-args: |
            BASE_IMAGE=ghcr.io/cynkru/base:${{ steps.base.outputs.tag }}
          labels: ${{ steps.meta-delta.outputs.labels }}
          cache-from: ${{ github.event_name != 'workflow_dispatch' && 'type=gha,scope=buildx-delta-multi-arch' || '' }}
          cache-to: type=gha,scope=buildx-delta-multi-arch,mode=max

      # cynkru/bonfire
      - name: Docker meta
        id: meta-bonfire
        uses: docker/metadata-action@v4
        with:
          images: |
            ghcr.io/cynkru/bonfire
          flavor: latest=${{ steps.release.outputs.latest }}
      - name: Publish
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          file: crates/bonfire/Dockerfile
          tags: ${{ steps.meta-bonfire.outputs.tags }}
          build-args: |
            BASE_IMAGE=ghcr.io/cynkru/base:${{ steps.base.outputs.tag }}
          labels: ${{ steps.meta-bonfire.outputs.labels }}
          cache-from: ${{ github.event_name != 'workflow_dispatch' && 'type=gha,scope=buildx-bonfire-multi-arch' || '' }}
          cache-to: type=gha,scope=buildx-bonfire-multi-arch,mode=max

      # cynkru/autumn
      - name: Docker meta
        id: meta-autumn
        uses: docker/metadata-action@v4
        with:
          images: |
            ghcr.io/cynkru/autumn
          flavor: latest=${{ steps.release.outputs.latest }}
      - name: Publish
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          file: crates/services/autumn/Dockerfile
          tags: ${{ steps.meta-autumn.outputs.tags }}
          build-args: |
            BASE_IMAGE=ghcr.io/cynkru/base:${{ steps.base.outputs.tag }}
          labels: ${{ steps.meta-autumn.outputs.labels }}
          cache-from: ${{ github.event_name != 'workflow_dispatch' && 'type=gha,scope=buildx-autumn-multi-arch' || '' }}
          cache-to: type=gha,scope=buildx-autumn-multi-arch,mode=max

      # cynkru/january
      - name: Docker meta
        id: meta-january
        uses: docker/metadata-action@v4
        with:
          images: |
            ghcr.io/cynkru/january
          flavor: latest=${{ steps.release.outputs.latest }}
      - name: Publish
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          file: crates/services/january/Dockerfile
          tags: ${{ steps.meta-january.outputs.tags }}
          build-args: |
            BASE_IMAGE=ghcr.io/cynkru/base:${{ steps.base.outputs.tag }}
          labels: ${{ steps.meta-january.outputs.labels }}
          cache-from: ${{ github.event_name != 'workflow_dispatch' && 'type=gha,scope=buildx-january-multi-arch' || '' }}
          cache-to: type=gha,scope=buildx-january-multi-arch,mode=max

      # cynkru/gifbox
      - name: Docker meta
        id: meta-gifbox
        uses: docker/metadata-action@v4
        with:
          images: |
            ghcr.io/cynkru/gifbox
          flavor: latest=${{ steps.release.outputs.latest }}
      - name: Publish
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          file: crates/services/gifbox/Dockerfile
          tags: ${{ steps.meta-gifbox.outputs.tags }}
          build-args: |
            BASE_IMAGE=ghcr.io/cynkru/base:${{ steps.base.outputs.tag }}
          labels: ${{ steps.meta-gifbox.outputs.labels }}
          cache-from: ${{ github.event_name != 'workflow_dispatch' && 'type=gha,scope=buildx-gifbox-multi-arch' || '' }}
          cache-to: type=gha,scope=buildx-gifbox-multi-arch,mode=max

      # cynkru/crond
      - name: Docker meta
        id: meta-crond
        uses: docker/metadata-action@v4
        with:
          images: |
            ghcr.io/cynkru/crond
          flavor: latest=${{ steps.release.outputs.latest }}
      - name: Publish
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          file: crates/daemons/crond/Dockerfile
          tags: ${{ steps.meta-crond.outputs.tags }}
          build-args: |
            BASE_IMAGE=ghcr.io/cynkru/base:${{ steps.base.outputs.tag }}
          labels: ${{ steps.meta-crond.outputs.labels }}
          cache-from: ${{ github.event_name != 'workflow_dispatch' && 'type=gha,scope=buildx-crond-multi-arch' || '' }}
          cache-to: type=gha,scope=buildx-crond-multi-arch,mode=max

      # cynkru/pushd
      - name: Docker meta
        id: meta-pushd
        uses: docker/metadata-action@v4
        with:
          images: |
            ghcr.io/cynkru/pushd
          flavor: latest=${{ steps.release.outputs.latest }}
      - name: Publish
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          file: crates/daemons/pushd/Dockerfile
          tags: ${{ steps.meta-pushd.outputs.tags }}
          build-args: |
            BASE_IMAGE=ghcr.io/cynkru/base:${{ steps.base.outputs.tag }}
          labels: ${{ steps.meta-pushd.outputs.labels }}
          cache-from: ${{ github.event_name != 'workflow_dispatch' && 'type=gha,scope=buildx-pushd-multi-arch' || '' }}
          cache-to: type=gha,scope=buildx-pushd-multi-arch,mode=max

      # cynkru/voice-ingress
      - name: Docker meta
        id: meta-voice-ingress
        uses: docker/metadata-action@v4
        with:
          images: |
            ghcr.io/cynkru/voice-ingress
          flavor: latest=${{ steps.release.outputs.latest }}
      - name: Publish
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          file: crates/daemons/voice-ingress/Dockerfile
          tags: ${{ steps.meta-voice-ingress.outputs.tags }}
          build-args: |
            BASE_IMAGE=ghcr.io/cynkru/base:${{ steps.base.outputs.tag }}
          labels: ${{ steps.meta-voice-ingress.outputs.labels }}
          cache-from: ${{ github.event_name != 'workflow_dispatch' && 'type=gha,scope=buildx-voice-ingress-multi-arch' || '' }}
          cache-to: type=gha,scope=buildx-voice-ingress-multi-arch,mode=max
